# INTELLECT-3-RL math: problems Qwen3-4B solves 0-7 of 8 times (20,078; only the ones it
# always solves are dropped). Super got 5-13% of the hardest (0-4 of 8) right early in the
# 2026-10-12d attempt, so the easier ones keep math groups carrying signal.
env.taskset.id = "i3-math"
# The math tasksets default to no network, which the subprocess runtime cannot enforce.
env.taskset.network_allow = ["*"]
env.taskset.filter.column = "avg@8_qwen3_4b_instruct_2507"
env.taskset.filter.min = 0.0
env.taskset.filter.max = 0.875
