output_dir = "/scratch/project_465002751/rasmus/artifacts/training"
max_steps = 5
seq_len = 2048

[run]
name = "lumi-rl-single-node"

[model]
name = "PrimeIntellect/Qwen3-0.6B-Reverse-Text-SFT"

[deployment]
type = "single_node"
gpus_per_node = 8
num_train_gpus = 1
num_infer_gpus = 1

[trainer.model]
attn = "flash_attention_2"

[orchestrator]
batch_size = 32
group_size = 4

[orchestrator.concurrency]
initial_inflight = 8
min_inflight = 4
max_inflight = 32

[orchestrator.train.sampling]
max_completion_tokens = 128

[[orchestrator.train.source]]
name = "reverse-text"
curriculum = { sampler = { type = "difficulty_pool" }, gates = { zero_advantage = { type = "advantage_range" } } }
env.taskset.id = "reverse-text"
env.agent.harness.id = "null"
env.agent.runtime.type = "subprocess"

[trainer.optim]
lr = 3e-6

[ckpt]

[inference]

[orchestrator.renderer]
name = "prime-qwen3"

[slurm]
job_name = "prime-rl-rl-lumi"
account = "project_465002751"
project_dir = "."
partition = "standard-g"
template_path = "src/prime_rl/templates/lumi/single_node_rl_lumi.sbatch.j2"
