output_dir = "/scratch/project_465002183/rasmus/post/external/prime-rl/outputs/lumi-hendrycks-sanity-500-seq16k-r6"
max_steps = 500
seq_len = 8192

[deployment]
type = "single_node"
gpus_per_node = 8
num_train_gpus = 4
num_infer_gpus = 4

[model]
name = "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"

[wandb]
project = "prime-rl"
name = "lumi-hendrycks-sanity-500-seq16k-r6"
offline = false
shared = true

[trainer.model]
name = "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
seq_len = 16384
attn = "sdpa"
fused_lm_head_token_chunk_size = 1024

[orchestrator]
batch_size = 512
rollouts_per_example = 8
use_token_client = false

[orchestrator.buffer]
online_difficulty_filtering = true

[orchestrator.sampling]
max_tokens = 2048

[[orchestrator.env]]
id = "math-env"
name = "hendrycks-math"
args = { dataset_name = "mikasenghaas/Sanity-Test-R1D-1.5B", dataset_subset = "default" }

[orchestrator.eval]
interval = 50
eval_base_model = false

[orchestrator.eval.sampling]
max_tokens = 2048

[[orchestrator.eval.env]]
id = "aime2024"
name = "aime2024"
rollouts_per_example = 32

[inference.model]
max_model_len = 8192

