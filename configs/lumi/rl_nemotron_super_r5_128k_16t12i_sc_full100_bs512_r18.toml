[inference]
use_deep_gemm = false
enable_fp32_lm_head = true
enable_fp32_router_logits = true

# Host prefix cache: aggregate across the eight TP workers on each node.
[inference.kv_cache_offload]
type = "native"
[inference.kv_cache_offload.cpu]
num_bytes = 206158430208 # 192 GiB per inference replica/node

[inference.deployment]
type = "multi_node"
num_nodes = 1
gpus_per_node = 8

[inference.router]
type = "llm-d"

[inference.router.scorers]
kv-cache-utilization-scorer = 3.0
queue-scorer = 2.0
active-request-scorer = 1.0
prefix-cache-scorer = 1.0

[inference.vllm]
# Validated with empty and 81%-occupied reloads plus isolated 128K output parity.
kv_cache_memory_bytes = 15032385536
worker_cls = "dfm_evals.nemotron_worker.VerifiedSuperWorker"
attention_backend = "ROCM_AITER_FA"
safetensors_load_strategy = "prefetch"
trust_remote_code = true
dtype = "bfloat16"
max_model_len = 131072
tool_call_parser = "qwen3_coder"
reasoning_parser = "nemotron_v3"
tensor_parallel_size = 8
data_parallel_size = 1
enable_prefix_caching = true
mamba_cache_mode = "align"
gpu_memory_utilization = 0.65
enable_expert_parallel = true
all2all_backend = "allgather_reducescatter"
enable_eplb = false
enable_dbo = false
language_model_only = true
max_num_batched_tokens = 32768
max_num_seqs = 64
block_size = 2048
mamba_ssm_cache_dtype = "float32"

[ckpt]
interval = 5
keep_last = 2
keep_interval = 25

[monitors.file]

[log]
level = "info"

[orchestrator.eval]
interval = 12
num_examples = 4
group_size = 1
skip_first_step = false

[orchestrator.eval.sampling]
reasoning_effort = "high"
temperature = 1.0
max_completion_tokens = 4096

