# Search-free training: batch 512 with the existing category proportions.
# Full publisher task pools; task images prepared on demand, without oracle admission gates.
# Full 100-step run: 16 trainer nodes (SFT topology), twelve TP8 inference replicas.
output_dir = "/scratch/project_465002751/rasmus/artifacts/training"
clean = false
max_steps = 100
seq_len = 131072

[run]
name = "rl-super-r5-step2619-sc-full100-bs512-r18-20260927"

[deployment]
type = "multi_node"
num_train_nodes = 16
num_infer_nodes = 1
num_infer_replicas = 12
gpus_per_node = 8
orchestrator_on_inference = true

[slurm]
exclude = "nid006371,nid006519"
job_name = "super-rl-sc-full100-bs512-r18"
template_path = "src/prime_rl/templates/multi_node_rl_lumi.sbatch.j2"
partition = "standard-g"
account = "project_465002751"
time = "24:00:00"
cleanup_grace_period = 60

[model]
name = "/scratch/project_465002751/rasmus/artifacts/training/nemotron-super-base-r5-16n-cp8-ep8-bs32-lr1e5-r1/eval-exports/step_2619"

[weight_broadcast]
type = "nccl"
timeout = 1800

[trainer]
enable_router_replay = false
dist_timeout_seconds = 1800

[trainer.model]
conversion_dir = "/scratch/project_465002751/rasmus/artifacts/training/nemotron-super-r5-final-sc-20260919/conversion"
attn = "flash_attention_2"
impl = "custom"
optim_cpu_offload = false
fsdp_cpu_offload = false
ac_offloading = "None"
reshard_after_forward = true
ep = 8
cp = 8
cp_style = "ulysses"
fused_lm_head_token_chunk_size = 2048

[trainer.model.ac]
mode = "full"

[trainer.model.compile]
fullgraph = false

[trainer.optim]
type = "adamw"
lr = 1e-6
weight_decay = 0.1
max_norm = 1.0

[trainer.loss]
type = "score_centering"
top_k = 32
importance_sampling = "none"

[orchestrator]
batch_size = 512
group_size = 8
max_off_policy_steps = 5

[orchestrator.concurrency]
throughput_balancing = true
scheduler_target_mix = 0.5
scheduler_oversampling = 3.0
scheduler_min_oversampling = 0.0
scheduler_max_oversampling = 16.0
scheduler_acceptance_floor = 0.05
scheduler_inventory_factor = 2.0
category_targets.swe = 240
category_targets.terminal = 144
category_targets.sql = 32
category_targets.tooluse = 64
category_targets.instruction = 32
category_batch_tolerance = 2
category_max_surplus = 8
lookahead_batches = 4
eval_fraction = 0.125
initial_inflight = 512
min_inflight = 128
max_inflight = 1024

[orchestrator.renderer]
name = "nemotron-3"
enable_thinking = true
truncate_history_thinking = false
low_effort = false

[orchestrator.algo]
type = "grpo"

[orchestrator.algo.behavior_penalty]
penalty = 0.1

[orchestrator.train.sampling]
reasoning_effort = "high"
temperature = 1.0
max_completion_tokens = 4096

