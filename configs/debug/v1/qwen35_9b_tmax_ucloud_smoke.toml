# Two-GPU v1 smoke run on one internally built TMax task image.

output_dir = "outputs/qwen35-9b-tmax-ucloud-smoke"
max_steps = 1
seq_len = 16384

[deployment]
num_train_gpus = 1
num_infer_gpus = 1
gpus_per_node = 2

[model]
name = "Qwen/Qwen3.5-9B"

[orchestrator]
batch_size = 2
group_size = 2
pool_size = 1
max_inflight_rollouts = 2

[orchestrator.renderer]
name = "qwen3.5"
enable_thinking = true

[orchestrator.train.sampling]
max_completion_tokens = 8192

[[orchestrator.train.env]]
name = "tmax-ucloud"
pool = { type = "static", num_workers = 1 }
harness = { id = "mini-swe-agent", env = { TMPDIR = "/home/user/.cache/tmp", UV_CACHE_DIR = "/home/user/.cache/uv" }, runtime = { type = "ucloud", image = "ubuntu:22.04", network = "bridge", ttl_seconds = 7200, request_timeout_seconds = 120, start_timeout_seconds = 1800, labels = { experiment = "tmax-smoke" } } }

[orchestrator.train.env.taskset]
id = "tmax-v1"
tasks = "task_000000_f8baca82"
image_prefix = "ucloud-sandbox-registry:5000/prime-rl/tmax"
image_profile = "mini-swe-agent-2.2.8"
image_apt_packages = ["curl", "ca-certificates"]
build_missing_images = true
max_concurrent_builds = 1

[trainer]

[trainer.model.ac]
freq = 1

[trainer.optim]
lr = 3e-6

[inference]
gpu_memory_utilization = 0.8
enable_prefix_caching = true

[inference.env_vars]
CUDA_HOME = "/opt/easybuild/ubuntu-24.04/amd/software/CUDA/12.8.0"

[inference.model]
max_model_len = 16384

[inference.parallel]
dp = 1
tp = 1

[inference.vllm_extra]
language_model_only = true
