[inference]
use_deep_gemm = false
enable_fp32_lm_head = true
enable_fp32_router_logits = true

[inference.router]
type = "vllm-router"
policy = "consistent_hash"

[inference.vllm]
safetensors_load_strategy = "prefetch"
trust_remote_code = true
dtype = "bfloat16"
quantization = "fp8_per_block"
max_model_len = 131072
tool_call_parser = "qwen3_coder"
reasoning_parser = "nemotron_v3"
language_model_only = true
tensor_parallel_size = 8
data_parallel_size = 1
data_parallel_size_local = 1
enable_expert_parallel = true
all2all_backend = "allgather_reducescatter"
enable_eplb = false
max_num_seqs = 176
max_num_batched_tokens = 8704
gpu_memory_utilization = 0.91
mamba_ssm_cache_dtype = "float32"
enable_prefix_caching = true
mamba_cache_mode = "align"

[inference.env_vars]
PRIME_RL_RELOAD_FILTER_NEMOTRON_EXPERTS = "1"
PRIME_RL_RELOAD_SKIP_MOE_EMPTY_CACHE = "1"
PRIME_RL_RELOAD_SKIP_BUFFER_DIAGNOSTICS = "1"
PYTHONPATH = "/dcai/projects/iu_0145/rasmus/infer-opt"
INFER_OPT = "ep_compact_moe,fast_generate,fi_moe_chunk,dg_jit_per_proc"
VLLM_TUNED_CONFIG_FOLDER = "/dcai/projects/iu_0145/rasmus/infer-opt/moe_configs"
VLLM_CACHE_ROOT = "/tmp/$SLURM_JOB_ID/vllm-cache"
TRITON_CACHE_DIR = "/tmp/$SLURM_JOB_ID/triton-cache"
VLLM_SSM_CONV_STATE_LAYOUT = "DS"
UCX_RCACHE_MAX_UNRELEASED = "1024"
UCX_MEMTYPE_CACHE = "n"

[inference.deployment]
type = "disaggregated"
gpus_per_node = 8
prefill_nodes_per_replica = 1
decode_nodes_per_replica = 1
num_prefill_replicas = 4
num_decode_replicas = 4

[inference.deployment.prefill_vllm_overrides]
all2all_backend = "allgather_reducescatter"

[inference.deployment.decode_vllm_overrides]
all2all_backend = "allgather_reducescatter"
max_num_seqs = 384

[inference.deployment.decode_vllm_overrides.compilation_config]
cudagraph_mode = "FULL_AND_PIECEWISE"

[inference.deployment.decode_env_vars]
UCX_NET_DEVICES = "mlx5_0:1,mlx5_3:1,mlx5_4:1,mlx5_5:1,mlx5_6:1,mlx5_9:1,mlx5_10:1,mlx5_11:1"

[ckpt]
interval = 5
keep_last = 2
keep_interval = 25

[monitors.file]

[log]
level = "info"

[env_vars]
NLTK_DATA = "/dcai/projects/iu_0145/lumi-mirror/rasmus/.cache/nltk_data"
BROWSECOMP_PLUS_CACHE_DIR = "/dcai/projects/iu_0145/lumi-mirror/rasmus/.cache/browsecomp-plus"
SSB_OVERRIDE_ALL_JUDGE_MODEL = "openai/glm-5.3-flash"
SSB_OVERRIDE_CLASSIFIER_MODEL = "openai/glm-5.3-flash"
SSB_OVERRIDE_VA_MODEL = "openai/glm-5.3-flash"
HF_DATASETS_OFFLINE = "1"
NCCL_DEBUG = "WARN"
PYTHONFAULTHANDLER = "1"
PRIME_RL_FAIL_ON_INFERENCE_EXIT = "1"
TORCH_NCCL_HIGH_PRIORITY = "1"
PRIME_RL_WEIGHT_NCCL_ALGO = "Ring"
PRIME_RL_WEIGHT_NCCL_PROTO = "Simple"
PRIME_RL_WEIGHT_HIGH_PRIORITY = "1"
